[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infralink-ops"
version = "0.2.3"
description = "Operational runtime for direct Infralink registry projections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "infralink @ https://github.com/cyberstorm-dev/infralink/releases/download/v0.6.6/infralink-0.6.6-py3-none-any.whl#sha256=158a6e5e1f68ea158a6f366835852249e48cf76a4a734e49c4fa18975cce1b9c",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
infralink-ops = "infralink_ops.cli:run"
infralink-controller-images = "infralink_ops.controller_images:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/infralink_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
