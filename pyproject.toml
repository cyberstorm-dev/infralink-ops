[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infralink-ops"
version = "0.1.0"
description = "Operational runtime for direct Infralink registry projections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "infralink @ https://github.com/cyberstorm-dev/infralink/releases/download/v0.6.4/infralink-0.6.4-py3-none-any.whl#sha256=c75b124dc3a723b0907e3fe1462e5a4081f631f6aa863b86b2320b40da4ce2e9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
infralink-ops = "infralink_ops.cli:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/infralink_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
