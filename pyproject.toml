[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infralink-ops"
version = "0.2.58"
description = "Operational runtime for direct Infralink registry projections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "infralink @ https://github.com/cyberstorm-dev/infralink/releases/download/v0.6.12/infralink-0.6.12-py3-none-any.whl#sha256=a70e1eeba5314ecf348357a5bf85610a507609733402380ba836a76f6b286edc",
  "Jinja2>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
infralink-ops = "infralink_ops.cli:run"
infralink-controller-images = "infralink_ops.controller_images:main"
infralink-controller-metrics = "infralink_ops.controller_metrics:main"
infralink-controller-reconcile-evidence = "infralink_ops.controller_reconcile_evidence:main"
infralink-controller-registry-checkout = "infralink_ops.controller_registry_checkout:main"
infralink-controller-config-consumers = "infralink_ops.controller_config_consumers:cli"
infralink-controller-adapter = "infralink_ops.controller_adapter_runnable:cli"
infralink-controller-runtime-directories = "infralink_ops.controller_runtime_directories:cli"
infralink-controller-doctor = "infralink_ops.controller_doctor:cli"
infralink-controller-render-secrets = "infralink_ops.controller_render_secrets:cli"
infralink-controller-firewall = "infralink_ops.controller_firewall:cli"
infralink-controller-image-resolution = "infralink_ops.image_resolution:main"
infralink-controller-reference = "infralink_ops.image_resolution:controller_reference_main"
infralink-controller-host-interface = "infralink_ops.controller_host_interface:cli"
infralink-controller-protected-transitions = "infralink_ops.controller_protected_transitions:cli"
infralink-controller-registry-transport-trust = "infralink_ops.registry_transport_trust:cli"
infralink-controller-template-dependencies = "infralink_ops.template_dependencies:cli"
infralink-controller-template-source-dependencies = "infralink_ops.template_source_dependencies:cli"
infralink-controller-bootstrap = "infralink_ops.controller_bootstrap:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/infralink_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
