[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infralink-ops"
version = "0.2.17"
description = "Operational runtime for direct Infralink registry projections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "infralink @ https://github.com/cyberstorm-dev/infralink/releases/download/v0.6.9/infralink-0.6.9-py3-none-any.whl#sha256=58cce6c950d8a928637edd3fc1722cdde71e9fae9b01544d88a0695aa2cf06af",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
infralink-ops = "infralink_ops.cli:run"
infralink-controller-images = "infralink_ops.controller_images:main"
infralink-controller-metrics = "infralink_ops.controller_metrics:main"
infralink-controller-registry-checkout = "infralink_ops.controller_registry_checkout:main"
infralink-controller-config-consumers = "infralink_ops.controller_config_consumers:cli"
infralink-controller-adapter = "infralink_ops.controller_adapter_runnable:cli"
infralink-controller-runtime-directories = "infralink_ops.controller_runtime_directories:cli"
infralink-controller-image-resolution = "infralink_ops.image_resolution:main"
infralink-controller-reference = "infralink_ops.image_resolution:controller_reference_main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/infralink_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
