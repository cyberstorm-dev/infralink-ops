[build-system]
requires = ["hatchling>=1.25", "agent-surface==0.1.7"]
build-backend = "hatchling.build"

[project]
name = "infralink-ops"
version = "0.2.86"
description = "Operational runtime for direct Infralink registry projections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "infralink>=0.6.22,<0.7",
  "Jinja2>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6", "twine>=6.0"]

[project.entry-points."infralink.commands"]
controller = "infralink_ops.controller_surface:build_app"

[tool.hatch.build.hooks.agent-surface]
factory = "infralink_ops.controller_surface:build_app"
source = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/infralink_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
